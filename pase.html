<!doctype html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Mi pase · Cabeza y Cuello</title>
<link rel="icon" href="img/logo-sello-96.png">
<style>
:root{--navy:#0A1B5C;--azul:#2F5BD8;--tinte:#F5F7FD;--tinte-2:#E2E8FA;--texto:#475485}
*{box-sizing:border-box}
body{margin:0;font-family:"Segoe UI",system-ui,-apple-system,sans-serif;color:var(--navy);background:var(--tinte);font-size:16px;line-height:1.5}
header{background:var(--navy);color:#fff;padding:16px 20px;display:flex;align-items:center;gap:12px}
header img{width:40px;height:40px}header b{display:block;font-size:16px}header span{font-size:12.5px;opacity:.75}
main{max-width:460px;margin:0 auto;padding:22px 16px 60px}
.pase{background:#fff;border:1px solid var(--tinte-2);border-radius:20px;padding:22px;display:grid;gap:12px;text-align:center}
h1{font-size:20px;margin:0}
.qr img{width:240px;height:240px;image-rendering:pixelated}
.datos{display:grid;gap:2px;font-size:15.5px}.datos span{color:var(--texto);font-size:14px}
.folio{font-size:22px;font-weight:700;letter-spacing:.06em}
.estado{border-radius:12px;padding:10px 12px;font-weight:600;font-size:14.5px}
.estado.ok{background:#dcf5e3;color:#11632f}.estado.pend{background:#fff4d6;color:#7a5a00;font-weight:500}.estado.mal{background:#fde2e2;color:#8a1c1c}
.nota{color:var(--texto);font-size:14px;margin:0}
</style>
</head>
<body>
<header><img src="img/logo-sello-96.png" alt=""><div><b>Unidad de Alta Especialidad en Cabeza y Cuello</b><span>Pase de tu cita</span></div></header>
<main><div class="pase" id="caja"><p class="nota">Cargando…</p></div></main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script>
var API = 'https://cyc-citas.vonoaweb.workers.dev/api/', q = new URLSearchParams(location.search);
var caja = document.getElementById('caja');
var esc = function (t) { return String(t == null ? '' : t).replace(/[&<>"]/g, function (c) { return {'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]; }); };
function hora12(h) { if (!h) return ''; var p = h.split(':'), n = +p[0]; return (n % 12 || 12) + ':' + p[1] + (n < 12 ? ' a. m.' : ' p. m.'); }  /* 9:30 a. m. (se guarda en 24 h) */
function fechaLarga(f) { return new Date(f + 'T12:00').toLocaleDateString('es-MX', {weekday: 'long', day: 'numeric', month: 'long'}); }
fetch(API + 'pase?f=' + encodeURIComponent(q.get('f') || '') + '&t=' + encodeURIComponent(q.get('t') || '')).then(function (r) { return r.json(); }).then(function (d) {
  if (d.error) { caja.innerHTML = '<h1>Pase no válido</h1><p class="nota">Escríbenos por WhatsApp y te lo volvemos a mandar.</p>'; return; }
  var qr = qrcode(0, 'M'); qr.addData(location.href); qr.make();
  var estado = d.checkin ? '<div class="estado ok">Llegada registrada · ' + new Date(d.checkin).toLocaleTimeString('es-MX', {hour: '2-digit', minute: '2-digit'}) + '</div>'
    : d.estado === 'cancelada' ? '<div class="estado mal">Esta cita está cancelada</div>'
    : d.estado === 'por_pagar' ? '<div class="estado pend">Falta tu anticipo de $' + d.anticipo + '. Págalo antes del ' + new Date(d.vence).toLocaleString('es-MX', {weekday: 'long', day: 'numeric', month: 'long', hour: '2-digit', minute: '2-digit'}) + ' o la hora se libera.' +
        (d.transferencia ? '<br>CLABE ' + d.transferencia.clabe + (d.transferencia.banco ? ' (' + esc(d.transferencia.banco) + ')' : '') + ' · concepto ' + esc(d.folio) : '') + '</div>' : '';
  caja.innerHTML = '<h1>' + esc(d.nombre) + '</h1>' + estado +
    '<div class="qr"><img alt="QR del pase" src="' + qr.createDataURL(8, 2) + '"></div><div class="folio">' + esc(d.folio) + '</div>' +
    '<div class="datos"><div><b>' + fechaLarga(d.fecha) + ' · ' + hora12(d.hora) + '</b></div><div>' + esc(d.medico) + '</div><span>' + esc(d.tipo) + (d.consultorio ? ' · Consultorio ' + d.consultorio : '') + '</span></div>' +
    '<p class="nota">Enseña este QR en la unidad al llegar. Llega 10 minutos antes. Para cancelar o cambiar tu cita, escríbenos por <a href="https://wa.me/' + d.whatsappUnidad + '?text=' + encodeURIComponent('Hola, sobre mi cita con folio ' + d.folio + ':') + '">WhatsApp</a>.</p>';
}).catch(function () { caja.innerHTML = '<p class="nota">No se pudo cargar. Revisa tu conexión e intenta de nuevo.</p>'; });
</script>
</body>
</html>
