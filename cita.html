<!doctype html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Elige tu horario · Cabeza y Cuello</title>
<link rel="icon" href="img/logo-sello-96.png">
<style>
:root{--navy:#0A1B5C;--azul:#2F5BD8;--tinte:#F5F7FD;--tinte-2:#E2E8FA;--texto:#475485}
*{box-sizing:border-box}
body{margin:0;font-family:"Segoe UI",system-ui,-apple-system,sans-serif;color:var(--navy);background:var(--tinte);font-size:16px;line-height:1.5}
header{background:var(--navy);color:#fff;padding:16px 20px;display:flex;align-items:center;gap:12px}
header img{width:40px;height:40px}header b{display:block;font-size:16px}header span{font-size:12.5px;opacity:.75}
main{max-width:560px;margin:0 auto;padding:22px 16px 60px}
.caja{background:#fff;border:1px solid var(--tinte-2);border-radius:16px;padding:20px;display:grid;gap:14px}
h1{font-size:21px;margin:0}
.op{display:flex;align-items:center;gap:12px;padding:14px;border:1px solid var(--tinte-2);border-radius:12px;cursor:pointer;font-size:15.5px}
.op input{accent-color:var(--azul);width:18px;height:18px}.op:has(input:checked){border-color:var(--azul);background:#f2f5fe}
button{font:inherit}
.btn{display:inline-flex;justify-content:center;align-items:center;border:0;border-radius:40px;padding:13px 20px;font-weight:600;cursor:pointer;text-decoration:none;background:var(--azul);color:#fff}
.btn-linea{background:#fff;color:var(--navy);border:1px solid var(--tinte-2)}
.nota{color:var(--texto);font-size:14px;margin:0}
.trans{display:grid;gap:4px;border:1px solid var(--tinte-2);border-radius:12px;padding:14px 16px;font-size:15px}
</style>
</head>
<body>
<header><img src="img/logo-sello-96.png" alt=""><div><b>Unidad de Alta Especialidad en Cabeza y Cuello</b><span>Tu consulta virtual</span></div></header>
<main><div class="caja" id="caja"><p class="nota">Cargando…</p></div></main>
<script>
var API = 'https://cyc-citas.vonoaweb.workers.dev/api/', q = new URLSearchParams(location.search), F = q.get('f'), T = q.get('t');
var caja = document.getElementById('caja');
function hora12(h) { if (!h) return ''; var p = h.split(':'), n = +p[0]; return (n % 12 || 12) + ':' + p[1] + (n < 12 ? ' a. m.' : ' p. m.'); }  /* 9:30 a. m. (se guarda en 24 h) */
function fechaLarga(f) { return new Date(f + 'T12:00').toLocaleDateString('es-MX', {weekday: 'long', day: 'numeric', month: 'long'}); }
/* datos para pagar la consulta (transferencia y, si la unidad lo activó, Mercado Pago) */
function pagar(d, fecha, hora, pagoMP) {
  var tr = d.transferencia, comp = 'Hola, ya pagué mi consulta por videollamada ' + d.folio + ' con ' + d.medico + ' (' + fechaLarga(fecha) + ', ' + hora12(hora) + '). Aquí va mi comprobante:';
  return '<h1>Confirma tu consulta con tu pago</h1><p><b>' + fechaLarga(fecha) + ', ' + hora12(hora) + '</b><br>' + d.medico + ' · folio ' + d.folio + '</p>' +
    '<p>Para confirmarla paga <b>$' + d.precio + '</b>. Cuando recibamos tu pago te mandamos la liga de la videollamada.</p>' +
    (pagoMP ? '<a class="btn" href="' + pagoMP + '">Pagar con tarjeta o Mercado Pago</a>' : '') +
    (tr ? '<div class="trans"><b>' + (pagoMP ? 'O por transferencia' : 'Pago por transferencia') + '</b><span>Banco: ' + tr.banco + '</span><span>A nombre de: ' + tr.titular + '</span><span>CLABE: <b>' + tr.clabe.replace(/(\d{3})(\d{3})(\d{11})(\d)/, '$1 $2 $3 $4') + '</b></span><span>Monto: <b>$' + d.precio + '</b> · Concepto: <b>' + d.folio + '</b></span></div>' : '') +
    '<a class="btn' + (pagoMP ? ' btn-linea' : '') + '" href="https://wa.me/' + d.whatsappUnidad + '?text=' + encodeURIComponent(comp) + '" target="_blank" rel="noopener">Mandar mi comprobante por WhatsApp</a>' +
    '<p class="nota">Recuerda: si cancelas se cobra el 50 % y si no te conectas a la hora acordada, la consulta se cobra completa.</p>';
}
function confirmada(d) {
  return '<h1>¡Tu consulta está confirmada!</h1><p><b>' + fechaLarga(d.fecha) + ', ' + hora12(d.hora) + '</b><br>' + d.medico + ' · folio ' + d.folio + '</p><p class="nota">Te mandaremos la liga de Google Meet por WhatsApp. Conéctate puntual.</p>';
}
var q2 = new URLSearchParams(location.search);
fetch(API + 'solicitud?f=' + encodeURIComponent(F) + '&t=' + encodeURIComponent(T)).then(function (r) { return r.json(); }).then(function (d) {
  if (d.error || d.quien !== 'paciente') { caja.innerHTML = '<h1>Liga no válida</h1><p class="nota">Escríbenos por WhatsApp y te la volvemos a mandar.</p>'; return; }
  if (q2.get('pago') === 'ok' && d.estado === 'por_pagar') { caja.innerHTML = '<h1>Estamos confirmando tu pago</h1><p class="nota">En unos minutos se confirma solo. Si no, escríbenos por WhatsApp con tu folio ' + d.folio + '.</p>'; return; }
  if (d.estado === 'por_pagar' && d.fecha) { caja.innerHTML = pagar(d, d.fecha, d.hora, null); return; }
  if (['agendada', 'realizada'].indexOf(d.estado) >= 0 && d.fecha) { caja.innerHTML = confirmada(d); return; }
  if (d.estado === 'cancelada') { caja.innerHTML = '<h1>Consulta cancelada</h1><p class="nota">Si crees que es un error, escríbenos por WhatsApp.</p>'; return; }
  if (d.estado !== 'opciones') { caja.innerHTML = '<h1>Consulta ' + d.folio + '</h1><p class="nota">Tu especialista todavía no propone horarios. Te avisamos por WhatsApp.</p>'; return; }
  caja.innerHTML = '<h1>Elige el horario de tu consulta</h1><p class="nota">' + d.medico + ' · ' + d.tipo + ' · folio ' + d.folio + '</p><form id="f" style="display:grid;gap:10px">' +
    d.opciones.map(function (o, i) { return '<label class="op"><input type="radio" name="op" value="' + i + '"' + (i ? '' : ' checked') + '> ' + fechaLarga(o.fecha) + ' · ' + hora12(o.hora) + '</label>'; }).join('') +
    '<button class="btn" id="enviar">Elegir este horario</button><p class="nota" id="nota"></p></form>';
  document.getElementById('f').onsubmit = function (e) {
    e.preventDefault();
    var i = +document.querySelector('[name=op]:checked').value, nota = document.getElementById('nota');
    document.getElementById('enviar').disabled = true; nota.textContent = 'Guardando…';
    fetch(API + 'paciente/elegir', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({folio: F, t: T, opcion: i})})
      .then(function (r) { return r.json().then(function (x) { if (!r.ok) throw new Error(x.error); return x; }); })
      .then(function (x) { caja.innerHTML = pagar(Object.assign({}, d, x), x.fecha, x.hora, x.pago); })
      .catch(function (err) { nota.textContent = err.message || 'No se pudo guardar.'; document.getElementById('enviar').disabled = false; });
  };
}).catch(function () { caja.innerHTML = '<p class="nota">No se pudo cargar. Revisa tu conexión e intenta de nuevo.</p>'; });
</script>
</body>
</html>
